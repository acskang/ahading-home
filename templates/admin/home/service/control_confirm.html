{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <h1>{{ title }}</h1>
  <p>
    {{ service.name }} 서비스를
    <strong>{% if target_online %}온라인{% else %}유지보수{% endif %}</strong>
    상태로 전환합니다.
  </p>
  <p>이 작업은 nginx 유지보수 게이트와 해당 서비스의 systemd 백엔드를 함께 제어합니다.</p>
  <form method="post">
    {% csrf_token %}
    <div class="submit-row">
      <input type="submit" value="확인 후 실행" class="default">
      <a href="{% url 'admin:home_service_changelist' %}" class="button cancel-link">취소</a>
    </div>
  </form>
</div>
{% endblock %}
